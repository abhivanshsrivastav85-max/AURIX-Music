name: Build AURIX APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Add Debug Package to google-services.json
        run: |
          python3 -c "
          import json
          with open('app/google-services.json', 'r') as f:
              data = json.load(f)
          clients = data.get('client', [])
          debug_client = None
          for c in clients:
              if c.get('client_info', {}).get('android_client_info', {}).get('package_name') == 'com.aurix.music':
                  import copy
                  debug_client = copy.deepcopy(c)
                  debug_client['client_info']['android_client_info']['package_name'] = 'com.aurix.music.debug'
                  break
          if debug_client:
              clients.append(debug_client)
              data['client'] = clients
              with open('app/google-services.json', 'w') as f:
                  json.dump(data, f, indent=2)
          "

      - name: Build Debug APK
        run: ./gradlew assembleUniversalGmsDebug -x test --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-Music-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
